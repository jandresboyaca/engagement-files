spring.application.name=fanout-worker

# Blocking loads on virtual threads (research.md section 1). With virtual threads and no web
# server every application thread is a daemon thread, so keep the JVM alive explicitly.
spring.threads.virtual.enabled=true
spring.main.keep-alive=true

# Initial C and F for capacity_settings; placeholders until agreed with the EMS team.
fanout.limits.global=20
fanout.limits.per-firm=5
# Above the longest time EMS can take for a load (spec Clarification 2).
fanout.load.timeout=5m
fanout.load.lease-grace=10s
fanout.load.connect-timeout=5s
fanout.retry.max-attempts=6
fanout.retry.base-delay=30s
fanout.retry.max-delay=30m
fanout.dispatch.period=1s
# fanout.ems.base-url has no default: every environment sets it.
