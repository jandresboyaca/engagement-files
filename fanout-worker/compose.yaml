services:
  postgres:
    image: 'postgres:18-alpine'
    environment:
      - 'POSTGRES_DB=fanout'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fanout}'
      - 'POSTGRES_USER=fanout'
    ports:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fanout -d fanout']
      interval: 2s
      timeout: 5s
      retries: 30
  wiremock:
    image: 'wiremock/wiremock:3.13.2'
    ports:
      - '8089:8080'
    volumes:
      - './wiremock:/home/wiremock'
  worker:
    build: .
    profiles:
      - app
    depends_on:
      postgres:
        condition: service_healthy
      wiremock:
        condition: service_started
    environment:
      - 'SPRING_PROFILES_ACTIVE=local'
      - 'SPRING_DOCKER_COMPOSE_ENABLED=false'
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/fanout'
      - 'SPRING_DATASOURCE_USERNAME=fanout'
      - 'SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-fanout}'
      - 'FANOUT_EMS_BASE_URL=http://wiremock:8080'
